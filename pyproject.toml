[project]
name = "replybench"
version = "0.1.0"
description = "Suggested email replies from an LLM, plus an accuracy system that says how good each reply is and why."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
replybench = "replybench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/replybench"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
